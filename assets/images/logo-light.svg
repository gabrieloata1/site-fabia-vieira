<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 64" fill="none">
    <!-- Flower Emblem -->
    <g transform="translate(4, 4) scale(0.875)">
      
    <!-- Outer Harmony Frame -->
    <circle cx="32" cy="32" r="30" stroke="#c4975c" stroke-width="1.2" opacity="0.9"/>
    <circle cx="32" cy="32" r="26.5" stroke="#e8ddd0" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.45"/>

    <!-- Calyx & Grounding Leaves -->
    <path d="M 22 47 C 27 50.5, 37 50.5, 42 47" stroke="#c4975c" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 32 48.5 C 26 50.5, 19 48, 16 45 C 20 44.5, 26 46, 32 48.5" stroke="#c4975c" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
    <path d="M 32 48.5 C 38 50.5, 45 48, 48 45 C 44 44.5, 38 46, 32 48.5" stroke="#c4975c" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>

    <!-- Wide outer welcoming petals -->
    <path d="M 32 46 C 21 46, 12 37.5, 12 28 C 16.5 29.5, 23 35, 27 40" stroke="#faf7f2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 32 46 C 43 46, 52 37.5, 52 28 C 47.5 29.5, 41 35, 37 40" stroke="#faf7f2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Intermediate blooming petals -->
    <path d="M 32 45 C 23.5 41, 18 31, 20 19.5 C 24 23, 28.5 30, 31 38" stroke="#c4975c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 32 45 C 40.5 41, 46 31, 44 19.5 C 40 23, 35.5 30, 33 38" stroke="#c4975c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Central rising petal (Core of growth) -->
    <path d="M 32 14.5 C 25.5 23, 25.5 35, 32 44 C 38.5 35, 38.5 23, 32 14.5 Z" stroke="#faf7f2" stroke-width="1.5" stroke-linejoin="round" fill="none"/>

    <!-- Inner drop / spark of life -->
    <path d="M 32 23.5 C 29.5 27.5, 29.5 32.5, 32 36 C 34.5 32.5, 34.5 27.5, 32 23.5 Z" stroke="#c4975c" stroke-width="1.1" fill="#c4975c" fill-opacity="0.25"/>

    <!-- Transformation Spark / Star at Apex -->
    <path d="M 32 8 Q 32 10 33.5 10 Q 32 10 32 12 Q 32 10 30.5 10 Q 32 10 32 8 Z" fill="#c4975c"/>
  
    </g>

    <!-- Typography -->
    <g transform="translate(72, 8)">
      <!-- Main Brand Name -->
      <text x="0" y="27" font-family="'Instrument Serif', Georgia, serif" font-size="26" font-style="italic" fill="#faf7f2" letter-spacing="1.5">Fábia Vieira</text>
      
      <!-- Decorative hairline divider with subtle golden botanical leaf/diamond -->
      <line x1="0" y1="36" x2="260" y2="36" stroke="#c4975c" stroke-width="0.75" opacity="0.6"/>
      <polygon points="130,34.5 132.5,36 130,37.5 127.5,36" fill="#c4975c"/>
      
      <!-- Descriptor / Positioning -->
      <text x="0" y="47" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="500" fill="#d4c5b2" letter-spacing="2.8">ORGANIZAÇÃO SISTÊMICA &amp; SUSTENTÁVEL</text>
    </g>
  </svg>